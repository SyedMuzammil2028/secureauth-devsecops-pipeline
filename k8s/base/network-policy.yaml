apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secureauth-backend-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secureauth
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: secureauth
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secureauth-frontend-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secureauth
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080

