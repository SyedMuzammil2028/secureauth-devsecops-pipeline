services:
  - type: web
    name: secureauth-api-v2
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.database.init_db && python -m backend.database.migrate_security_controls && python -m backend.database.create_admin && uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DB_PATH
        value: backend/database/auth_system.db
      - key: CORS_ORIGINS
        value: https://secureauth-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        value: 10
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_OTP_EXPIRY_MINUTES
        value: 5
      - key: MFA_TEMP_EXPIRY_MINUTES
        value: 5
      - key: NONCE_EXPIRY_MINUTES
        value: 2
      - key: SESSION_EXPIRY_HOURS
        value: 12
      - key: MAX_FAILED_ATTEMPTS
        value: 5
      - key: LOCKOUT_MINUTES
        value: 10
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10

  - type: web
    name: secureauth-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install --include=optional && npm install --no-save @rollup/rollup-linux-x64-gnu@4.60.2 && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_API_BASE_URL
        value: https://secureauth-api-v2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html







